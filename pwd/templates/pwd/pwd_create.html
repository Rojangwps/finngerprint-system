{% extends 'base.html' %}

{% block title %}Register PWD{% endblock %}

{% block content %}

<h2 class="page-title">Register PWD</h2>

<form id="pwdForm" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="button" id="registerFingerprintBtn">Register Fingerprint</button>
    <span id="fingerprintStatus" style="margin-left: 10px;"></span>

    <br><br>
    <button type="submit" id="submitBtn" disabled>Submit Registration</button>
</form>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const registerBtn = document.getElementById("registerFingerprintBtn");
    const submitBtn = document.getElementById("submitBtn");
    const statusSpan = document.getElementById("fingerprintStatus");

    registerBtn.addEventListener("click", function() {
        statusSpan.textContent = "Registering fingerprint...";
        registerBtn.disabled = true;

        fetch("{% url 'pwd:register_fingerprint' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
                username: document.querySelector('[name="user_username"]').value
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                statusSpan.textContent = "Fingerprint registered successfully ✅";
                submitBtn.disabled = false; // enable form submission
            } else {
                statusSpan.textContent = "Fingerprint registration failed ❌";
                console.error(data.error || "Unknown error");
                registerBtn.disabled = false;
            }
        })
        .catch(err => {
            statusSpan.textContent = "Error connecting to fingerprint scanner ❌";
            console.error(err);
            registerBtn.disabled = false;
        });
    });

    // Optional: prevent form submission if fingerprint not registered
    document.getElementById("pwdForm").addEventListener("submit", function(e) {
        if (submitBtn.disabled) {
            e.preventDefault();
            alert("Please register fingerprint before submitting the form.");
        }
    });
});
</script>

{% endblock %}
