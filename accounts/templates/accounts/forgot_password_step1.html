<!-- [FRONTEND] Forgot password - enter username -->

{% extends 'acc_base.html' %}


{% block title %}Forgot Password - Step 1{% endblock %}

{% block content %}
<h2>Forgot Password</h2>
<p><strong>Step 1 of 3:</strong> Enter your username</p>

<form method="post" action="{% url 'accounts:forgot_password_step1' %}">
    {% csrf_token %}
    
    <div>
        <label>Username: *</label><br>
        {{ form.username }}
        {% if form.username.errors %}
            <p style="color: red;">{{ form.username.errors }}</p>
        {% endif %}
    </div>
    
    <div>
        <button type="submit">Next →</button>
        <a href="{% url 'accounts:login' %}">Cancel</a>
    </div>
</form>
{% endblock %}
